<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Captura de Datos</title>
</head>
<body>

  <h2>Captura de Datos</h2>

  <form id="formulario" action="https://script.google.com/macros/s/AKfycbzY5R_9DJ4MPDPtzvegbo0g5swWH5Aw-sGAqTzT-wJwT7ujhDmmhFIfsLrVPqPcAzWPhw/exec" method="POST" target="hidden_iframe" onsubmit="enviado()">
    <label for="nombre">Nombre:</label><br>    
    <input type="text" id="nombre" name="nombre" required><br><br>

    <label for="edad">Edad:</label><br>
    <input type="number" id="edad" name="edad" required min="1" max="80"><br><br>
 
    <label for="ciudad">Ciudad:</label><br>    
    <input type="text" id="ciudad" name="ciudad" required><br><br>

    <label for="genero">Género:</label><br>    
    <input type="text" id="genero" name="genero" required><br><br>

    <label for="ocupacion">Ocupación:</label><br>    
    <input type="text" id="ocupacion" name="ocupacion" required><br><br>

    <label for="estadocivil">Estado Civíl:</label><br>    
    <input type="text" id="estadocivil" name="estadocivil" required><br><br>

    <label for="curp">CURP:</label><br>    
    <input type="text" id="curp" name="curp" required><br><br>

    <button type="submit" id="btnEnviar">Enviar</button>
  </form>

  <p id="estado"></p>

  <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

  <script>
    function enviado() {
      document.getElementById('btnEnviar').disabled = true;
      document.getElementById('estado').textContent = 'Guardando...';
      
      setTimeout(function() {
        document.getElementById('estado').textContent = '¡Registro guardado con éxito!';
        document.getElementById('formulario').reset();
        document.getElementById('btnEnviar').disabled = false;
      }, 1500);
    }
  </script>

</body>
</html>
